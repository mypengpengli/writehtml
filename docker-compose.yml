services:
  write:
    build: .
    container_name: writehtml
    restart: unless-stopped
    ports:
      - "9123:9123"   # 改端口就改这两个数（左=宿主机，右=容器）
    environment:
      # 数据库放在挂载卷里，容器重建不丢稿
      - DB_PATH=/data/writehtml.db
      # 开放注册、无需邀请码：每个人注册后自己在「设置」里填自己的 key
      - ALLOW_SIGNUP=true
      # 想改成凭邀请码注册（防陌生人建号占盘），把下面两行取消注释：
      # - ALLOW_SIGNUP=false
      # - SIGNUP_CODE=你定一串码
      # 想给所有用户兜底一个默认 key（用户没填自己的时用这个），取消下面注释：
      # - LLM_BASE_URL=https://api.deepseek.com/v1
      # - LLM_API_KEY=sk-xxx
      # - LLM_MODEL=deepseek-chat
      # 关闭“直接发送语音给 AI”时，转写服务可独立指定；留空则复用 LLM 配置
      # - ASR_BASE_URL=https://api.openai.com/v1
      # - ASR_API_KEY=sk-xxx
      # - ASR_MODEL=whisper-1
      # 可选：本机 meta-memory launcher。取消注释前，先将安装器产物挂载到容器（见下方 volumes）。
      # - AGENT_SKILL_DIR=/opt/meta-skills
      # - AGENT_SKILL_LAUNCHER=/opt/meta-runtime/launcher
      # - AGENT_SKILL_CWD=/app
      # - AGENT_SKILL_RUNTIME_DIR=/data/skill-turns
      # - AGENT_SKILL_AGENT_ID=writehtml-writing-agent-v1
      # 可选：Pi 原生全局配置 / Skills。开启后 Pi 的 bash、文件工具、扩展和包按官方机制运行。
      # - PI_CODING_AGENT_DIR=/opt/pi-agent
      # - PI_AGENT_SKILL_DIR=/opt/pi-skills
      # - PI_AGENT_WORKSPACE_DIR=/app
    volumes:
      - ./data:/data
      # - /opt/meta-skills:/opt/meta-skills:ro
      # - /opt/meta-runtime:/opt/meta-runtime:ro
      # - /opt/pi-agent:/opt/pi-agent
      # - /opt/pi-skills:/opt/pi-skills
